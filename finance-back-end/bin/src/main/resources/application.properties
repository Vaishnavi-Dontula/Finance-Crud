spring.application.name=finance-backend
server.port=8080

# Create this database once in MySQL: CREATE DATABASE finance_db;
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For local development only. Use migrations (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
